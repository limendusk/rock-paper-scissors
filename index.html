<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="button-container">
            <button class="choice">Rock</button>
            <button class="choice">Paper</button>
            <button class="choice">Scissors</button>
            <button class="reset-button">Reset Scores</button>
        </div>
        <div class="result-container">
            <p>
                Select any of the choices to start a game.<br>
                The first to get a score of 5 will win the game!
            </p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
